[package]
name = "engine-ipc"
version = "0.1.0"
edition = "2021"
description = "OmniPacker engine IPC protocol types (see docs/IPC-CONTRACT.md). Pure serde, no Tauri deps, so the cross-language contract tests run hermetically."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
